name: Corregir autores y título desde PDF (DeepSeek)

on:
  workflow_dispatch:
    inputs:
      ui_url:
        description: "Pega el link específico (ej. https://rdu.unc.edu.ar/workflowitems/50076/edit) O URL de MyDSpace con filtros"
        required: true
        default: "https://rdu.unc.edu.ar/workflowitems/50076/edit"
      dry_run:
        description: "Modo simulación (true = NO escribe en RDU, solo genera reporte de prueba)"
        type: boolean
        required: true
        default: true
      limite:
        description: "Límite de ítems (para link específico no aplica, para lote puedes poner ej. 1 o 5)"
        required: false
        default: "1"
      deepseek_model:
        description: "Modelo de DeepSeek a utilizar"
        required: false
        default: "deepseek-chat"

jobs:
  corregir-autores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install httpx pypdf openai

      - name: Ejecutar corrección de autores con DeepSeek
        env:
          RDU_UI_URL: ${{ github.event.inputs.ui_url }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          LIMITE: ${{ github.event.inputs.limite }}
          DEEPSEEK_MODEL: ${{ github.event.inputs.deepseek_model }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RDU_EMAIL: ${{ secrets.RDU_USER }}
          RDU_PASSWORD: ${{ secrets.RDU_PASS }}
        run: python scripts/corregir_autores_desde_pdf.py

      - name: Subir reporte CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-autores-corregidos
          path: reportes/*.csv
