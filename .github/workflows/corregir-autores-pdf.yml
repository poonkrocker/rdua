name: Corregir autores y título desde PDF (DeepSeek)

on:
  workflow_dispatch:
    inputs:
      ui_url:
        description: "URL de MyDSpace con los filtros"
        required: true
        default: "https://rdu.unc.edu.ar/mydspace?configuration=workflow&f.itemtype=article,equals&spc.page=1&f.dateIssued.min=2014&f.dateIssued.max=2014"
      dry_run:
        description: "Modo simulación (true = NO escribe en RDU, solo genera reporte)"
        type: boolean
        required: true
        default: true
      limite:
        description: "Límite de ítems a modificar (0 = sin límite, o ej. 1 o 2 para probar)"
        required: false
        default: "1"
      deepseek_model:
        description: "Modelo de DeepSeek a utilizar"
        required: false
        default: "deepseek-chat"

jobs:
  corregir-autores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install httpx pypdf openai

      - name: Ejecutar corrección de autores con DeepSeek
        env:
          RDU_UI_URL: ${{ github.event.inputs.ui_url }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          LIMITE: ${{ github.event.inputs.limite }}
          DEEPSEEK_MODEL: ${{ github.event.inputs.deepseek_model }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RDU_EMAIL: ${{ secrets.RDU_USER }}
          RDU_PASSWORD: ${{ secrets.RDU_PASS }}
        run: python scripts/corregir_autores_desde_pdf.py

      - name: Subir reporte CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-autores-corregidos
          path: reportes/*.csv
