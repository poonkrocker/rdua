name: Procesar items RDU

on:
  schedule:
    # Corre todos los días a las 09:00 UTC (06:00 hora Argentina). Ajustar a gusto.
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña Actions de GitHub

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar script
        env:
          PROVEEDOR: "deepseek"   # cambiar a "claude" si querés usar Claude en su lugar
          MODO_PRUEBA: "false"     # "true" = NO guarda (etapa de ajuste). "false" = guarda de verdad.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RDU_USER: ${{ secrets.RDU_USER }}
          RDU_PASS: ${{ secrets.RDU_PASS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ILOVEPDF_PUBLIC_KEY: ${{ secrets.ILOVEPDF_PUBLIC_KEY }}
          MAX_ITEMS_POR_CORRIDA: "5"
        run: python scripts/main.py

      - name: Subir capturas como artefacto
        if: always()  # se ejecuta aunque el script falle, para poder diagnosticar
        uses: actions/upload-artifact@v4
        with:
          name: capturas-rdu
          path: capturas/
          if-no-files-found: ignore
          retention-days: 7
