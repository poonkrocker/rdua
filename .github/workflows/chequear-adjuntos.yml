name: Chequear adjuntos rotos RDU

on:
  schedule:
    # Una vez por día. Cada corrida revisa TODA la lista de
    # reportes/entradas_a_revisar.xlsx de punta a punta (vos controlás el
    # universo a revisar editando ese archivo).
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # necesario para commitear el Excel y el reporte actualizados

jobs:
  chequear:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "DIAGNÓSTICO temporal: probar la API con curl desde este runner"
        continue-on-error: true
        run: |
          echo "===== IP pública de este runner ====="
          curl -s https://api.ipify.org || true
          echo ""
          echo ""
          echo "===== curl -v a la API pública (huella TLS/HTTP distinta a Python) ====="
          curl -sv "https://rdu.unc.edu.ar/server/api/discover/search/objects?dsoType=item&size=1" -o /tmp/curl_out.json 2>&1 | tail -60
          echo "----- bytes recibidos en el body: -----"
          wc -c /tmp/curl_out.json || true
          echo ""
          echo "===== curl a la home pública (sin /server/api) ====="
          curl -s -o /dev/null -w "status=%{http_code}\n" "https://rdu.unc.edu.ar/" || true

      - name: Instalar dependencias
        # Solo openpyxl (para leer/escribir el Excel): el resto del script
        # es librería estándar de Python, no necesita Playwright ni IA.
        run: pip install openpyxl==3.1.5

      - name: Ejecutar chequeo de adjuntos
        # RDU_USER/RDU_PASS son los mismos secrets que ya usa "Procesar items
        # RDU" — si no están cargados acá, el chequeo de ítems en revisión
        # (workflow) se omite solo, sin error.
        env:
          RDU_USER: ${{ secrets.RDU_USER }}
          RDU_PASS: ${{ secrets.RDU_PASS }}
        run: python scripts/chequear_adjuntos.py

      - name: Guardar Excel y reporte actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reportes/
          git diff --cached --quiet || git commit -m "Actualiza chequeo de adjuntos rotos"
          git push
